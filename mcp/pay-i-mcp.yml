note: >-
  This is a live, anonymous, remotely reachable MCP endpoint served from Pay-i's own docs host — an
  agent can POST to it today with no credentials. It is the ReadMe SuperHub built-in documentation
  MCP server (ReadMe release 5.862.1), not a bespoke Pay-i business-domain server: the four tools
  navigate and execute against Pay-i's OpenAPI rather than exposing Pay-i domain nouns such as
  limits, use cases or KPIs as first-class tools. execute-request is a generic HAR-request proxy,
  so calling any real Pay-i operation through it still requires the caller to supply their own
  xProxy-api-key header. Recorded as published-remote because the endpoint genuinely answers; the
  ReadMe provenance is recorded so the surface is not mistaken for a hand-built Pay-i tool server.
