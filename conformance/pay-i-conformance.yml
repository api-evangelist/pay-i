domain_standard:
  applicable: false
  note: >-
    REWARD-ONLY, and correctly unscored here. GenAI cost/FinOps metering has no ratified
    interchange standard for inference cost events. The FinOps Foundation's FOCUS specification is
    the nearest candidate for cloud cost data, but the Pay-i contract declares no FOCUS columns,
    no FOCUS media type and no FOCUS export operation, so no domain-standard conformance is
    asserted. Pay-i's proxy paths instead mirror the de-facto provider wire formats (OpenAI
    /v1/chat/completions, Anthropic /v1/messages, Bedrock converse/invoke, Vertex
    :generateContent), which is vendor-shape compatibility rather than a domain standard.
