x-adjacent-control: >-
  Pay-i's throttling concept is economic rather than request-rate based, and it IS well documented
  — spend Limits with a risk threshold, a per-limit `state` (ok / exceeded) returned in the
  xproxy_result object on every proxied response, and HTTP 424 Failed Dependency when a blocking
  limit stops the upstream provider call. That is a real runtime cost signal, but it is a spend
