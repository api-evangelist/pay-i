aid: pay-i
name: Pay-i
description: >-
  Pay-i is a GenAI cost, capacity and ROI optimization platform founded by Microsoft veterans. It
  instruments generative-AI applications so enterprises can prove the business value of their AI
  spend. Pay-i exposes a REST API at api.pay-i.com built around three surfaces: a metering proxy that
  fronts OpenAI, Azure OpenAI, Anthropic, Azure Anthropic, AWS Bedrock and Google Vertex and records
  cost, latency and failure metadata for every inference request; an ingest API for submitting events
  from providers Pay-i does not proxy; and a management API covering Limits (spend budgets with risk
  thresholds and blocking states), Use Cases and their versions and instances, KPIs and value
  policies, Categories and Resources for model and price catalogs, and Reports. Instrumentation is
  driven by a family of xProxy-* request headers and first-party Python and TypeScript SDKs, plus an
  n8n community node and a Databricks integration.
